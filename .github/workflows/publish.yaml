name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      - name: Detect workspace changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            node_redis:
              - 'packages/node-redis/**'
            ioredis:
              - 'packages/ioredis/**'
            redis_health:
              - 'packages/redis-health/**'
            example:
              - 'examples/nest-redis-example/**'
            ioredis_example:
              - 'examples/nest-ioredis-example/**'
              - 'packages/ioredis/**'
              - 'packages/redis-health/**'
      - name: Lint node-redis
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run lint
      - name: Build node-redis
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run build
      - name: Lint ioredis
        if: steps.changes.outputs.ioredis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-ioredis" run lint
      - name: Build ioredis
        if: steps.changes.outputs.ioredis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-ioredis" run build
      - name: Lint redis-health
        if: steps.changes.outputs.redis_health == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis-health" run lint
      - name: Build redis-health
        if: steps.changes.outputs.redis_health == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis-health" run build
      - name: Build example dependencies
        if: steps.changes.outputs.example == 'true'
        run: |
          pnpm -F "@nestjs-labs/nestjs-redis" run build
          pnpm -F "@nestjs-labs/nestjs-redis-health" run build
      - name: Lint example
        if: steps.changes.outputs.example == 'true'
        run: pnpm -F "nest-redis-example" run lint
      - name: Build example
        if: steps.changes.outputs.example == 'true'
        run: pnpm -F "nest-redis-example" run build
      - name: Build ioredis example dependencies
        if: steps.changes.outputs.ioredis_example == 'true'
        run: |
          pnpm -F "@nestjs-labs/nestjs-ioredis" run build
          pnpm -F "@nestjs-labs/nestjs-redis-health" run build
      - name: Lint ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" run lint
      - name: Build ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" run build
      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
