name: Testing
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    name: Node.js 24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect workspace changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            any_workspace:
              - 'packages/node-redis/**'
              - 'packages/ioredis/**'
              - 'packages/redis-health/**'
              - 'examples/nest-redis-example/**'
              - 'examples/nest-ioredis-example/**'
            node_redis:
              - 'packages/node-redis/**'
            ioredis:
              - 'packages/ioredis/**'
            redis_health:
              - 'packages/redis-health/**'
            example:
              - 'examples/nest-redis-example/**'
            ioredis_example:
              - 'examples/nest-ioredis-example/**'
              - 'packages/ioredis/**'
              - 'packages/redis-health/**'
      - name: Setup pnpm and Node.js
        if: steps.changes.outputs.any_workspace == 'true'
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      - name: Cache Docker images
        if: steps.changes.outputs.any_workspace == 'true'
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('compose.yaml') }}
      - name: Run docker-compose
        if: steps.changes.outputs.any_workspace == 'true'
        uses: hoverkraft-tech/compose-action@v2.0.2
        with:
          compose-file: './compose.yaml'
          compose-flags: '--profile standalone --profile cluster'
          up-flags: '-d'
          down-flags: '-v'
      - name: Lint node-redis
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run lint
      - name: Test node-redis
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run test
      - name: Build node-redis
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run build
      - name: E2E node-redis
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run test:e2e
      - name: Install redis 6 for node-redis compatibility
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" add redis@^6.0.0 --save-dev
      - name: Test node-redis with redis 6
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run test
      - name: Build node-redis with redis 6
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run build
      - name: E2E node-redis with redis 6
        if: steps.changes.outputs.node_redis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis" run test:e2e
      - name: Lint ioredis
        if: steps.changes.outputs.ioredis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-ioredis" run lint
      - name: Test ioredis
        if: steps.changes.outputs.ioredis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-ioredis" run test
      - name: Build ioredis
        if: steps.changes.outputs.ioredis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-ioredis" run build
      - name: E2E ioredis
        if: steps.changes.outputs.ioredis == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-ioredis" run test:e2e
      - name: Lint redis-health
        if: steps.changes.outputs.redis_health == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis-health" run lint
      - name: Test redis-health
        if: steps.changes.outputs.redis_health == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis-health" run test
      - name: Build redis-health
        if: steps.changes.outputs.redis_health == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis-health" run build
      - name: E2E redis-health
        if: steps.changes.outputs.redis_health == 'true'
        run: pnpm -F "@nestjs-labs/nestjs-redis-health" run test:e2e
      - name: Build example dependencies
        if: steps.changes.outputs.example == 'true'
        run: |
          pnpm -F "@nestjs-labs/nestjs-redis" run build
          pnpm -F "@nestjs-labs/nestjs-redis-health" run build
      - name: Lint example
        if: steps.changes.outputs.example == 'true'
        run: pnpm -F "nest-redis-example" run lint
      - name: Test example
        if: steps.changes.outputs.example == 'true'
        run: pnpm -F "nest-redis-example" run test
      - name: Build example
        if: steps.changes.outputs.example == 'true'
        run: pnpm -F "nest-redis-example" run build
      - name: E2E example
        if: steps.changes.outputs.example == 'true'
        run: pnpm -F "nest-redis-example" run test:e2e
      - name: Build ioredis example dependencies
        if: steps.changes.outputs.ioredis_example == 'true'
        run: |
          pnpm -F "@nestjs-labs/nestjs-ioredis" run build
          pnpm -F "@nestjs-labs/nestjs-redis-health" run build
      - name: Lint ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" run lint
      - name: Typecheck ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" exec tsc -p tsconfig.json --noEmit
      - name: Test ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" run test
      - name: Build ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" run build
      - name: E2E ioredis example
        if: steps.changes.outputs.ioredis_example == 'true'
        run: pnpm -F "nest-ioredis-example" run test:e2e
